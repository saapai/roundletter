<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>saapai</title>
  <meta name="description" content="saapai" />
  <link rel="canonical" href="https://saathvikpai.com" />
  <meta property="og:title" content="saapai" />
  <meta property="og:url" content="https://saathvikpai.com" />
  <meta property="og:type" content="website" />
  <style>
    html, body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: #0a0a0a;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url('/art/bg-painting.jpeg') center center / cover no-repeat;
      filter: brightness(0.45) saturate(0.8);
    }

    .gallery {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      box-sizing: border-box;
      will-change: transform;
      /* transform-origin set to the doorframe spot on the sketch */
      transform-origin: 42% 38%;
    }

    .sketch {
      display: block;
      max-width: min(60vw, 620px);
      max-height: 70vh;
      width: auto;
      height: auto;
      object-fit: contain;
      opacity: 0;
      animation: reveal 1.8s cubic-bezier(0.25, 0.1, 0.25, 1) 0.3s forwards;
      /* Feather edges so sketch dissolves into the background */
      mask-image: radial-gradient(
        ellipse 85% 85% at 50% 50%,
        black 55%,
        rgba(0,0,0,0.6) 72%,
        rgba(0,0,0,0.2) 88%,
        transparent 100%
      );
      -webkit-mask-image: radial-gradient(
        ellipse 85% 85% at 50% 50%,
        black 55%,
        rgba(0,0,0,0.6) 72%,
        rgba(0,0,0,0.2) 88%,
        transparent 100%
      );
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .name {
      position: fixed;
      bottom: 2rem;
      right: 2.5rem;
      z-index: 3;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: rgba(255,255,255,0.6);
      opacity: 0;
      letter-spacing: 0.1em;
      text-transform: lowercase;
      line-height: 1;
      user-select: none;
      animation: placard-in 1.2s cubic-bezier(0.25, 0.1, 0.25, 1) 1.8s forwards;
    }

    @keyframes placard-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ── Eyes ── */
    .eyes-wrap {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
      mix-blend-mode: difference;
      cursor: pointer;
      opacity: 0;
      animation: placard-in 1s ease-out 2.6s forwards;
    }

    .eye {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.25);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: height 0.15s ease, border-radius 0.15s ease;
    }

    .pupil {
      width: 5px;
      height: 5px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      transition: transform 0.08s ease-out, opacity 0.15s ease;
    }

    .eye.blink { height: 3px; border-radius: 2px; overflow: hidden; }
    .eye.blink .pupil { opacity: 0; }

    @media (max-width: 640px) {
      .sketch { max-width: 88vw; max-height: 60vh; }
      .name { bottom: 1.25rem; right: 1.5rem; font-size: 10px; letter-spacing: 0.08em; }
      .eyes-wrap { top: 12px; gap: 6px; }
      .eye { width: 14px; height: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sketch, .name, .eyes-wrap { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="bg" id="bg"></div>

  <div class="eyes-wrap" id="eyes">
    <div class="eye"><div class="pupil"></div></div>
    <div class="eye"><div class="pupil"></div></div>
  </div>

  <div class="gallery" id="gallery">
    <img class="sketch" id="sketch" src="/art/sketch-homepage.jpeg" alt="Pencil sketch" />
  </div>

  <span class="name" id="nameEl">saapai</span>

  <script>
    const bg = document.getElementById('bg');
    const gallery = document.getElementById('gallery');
    const sketch = document.getElementById('sketch');
    const nameEl = document.getElementById('nameEl');
    const eyesEl = document.getElementById('eyes');

    // rawScroll: negative = scroll down (into bg), positive = scroll up (into sketch)
    let rawScroll = 0;
    const SCROLL_UP_MAX = 2000;   // into the sketch
    const SCROLL_DOWN_MAX = 1500; // into the background

    const TILT_CORRECTION = -8;
    const MAX_SCALE_IN = 3.2;

    // Bell curve rate: slow → fast → slow
    function bellCurveMap(t) {
      if (t <= 0) return 0;
      if (t >= 1) return 1;
      const z = (t - 0.5) / 0.18;
      return 1 / (1 + Math.exp(-1.7 * z * (1 + 0.044715 * z * z) * 1.5));
    }

    function applyScroll() {
      if (rawScroll >= 0) {
        // ── SCROLL UP: zoom into the sketch ──
        const t = Math.min(1, rawScroll / SCROLL_UP_MAX);
        const eased = bellCurveMap(t);

        const scale = 1 + eased * (MAX_SCALE_IN - 1);
        const rotate = eased * TILT_CORRECTION;
        gallery.style.transform = `scale(${scale}) rotate(${rotate}deg)`;
        gallery.style.opacity = 1;

        // Relax mask as sketch fills viewport
        const maskCore = 55 + eased * 30;
        const maskMid = 72 + eased * 18;
        const maskOuter = 88 + eased * 10;
        const maskCSS = `radial-gradient(
          ellipse 85% 85% at 50% 50%,
          black ${maskCore}%,
          rgba(0,0,0,0.6) ${maskMid}%,
          rgba(0,0,0,0.2) ${maskOuter}%,
          transparent 100%
        )`;
        sketch.style.maskImage = maskCSS;
        sketch.style.webkitMaskImage = maskCSS;

        // Bg dims as sketch takes over
        const bgBrightness = 0.45 - eased * 0.2;
        bg.style.filter = `brightness(${bgBrightness}) saturate(${0.8 - eased * 0.3})`;

        nameEl.style.opacity = Math.max(0, 1 - t * 3);
        eyesEl.style.opacity = Math.max(0, 1 - t * 4);

      } else {
        // ── SCROLL DOWN: dissolve sketch, reveal background painting ──
        const t = Math.min(1, Math.abs(rawScroll) / SCROLL_DOWN_MAX);
        const eased = bellCurveMap(t);

        // Sketch shrinks slightly and fades out
        const scale = 1 - eased * 0.15;
        gallery.style.transform = `scale(${scale})`;
        gallery.style.opacity = Math.max(0, 1 - eased * 1.8);

        // Reset mask to default
        const defaultMask = `radial-gradient(
          ellipse 85% 85% at 50% 50%,
          black 55%, rgba(0,0,0,0.6) 72%, rgba(0,0,0,0.2) 88%, transparent 100%
        )`;
        sketch.style.maskImage = defaultMask;
        sketch.style.webkitMaskImage = defaultMask;

        // Background brightens, saturates — painting revealed
        const bgBrightness = 0.45 + eased * 0.45; // 0.45 → 0.9
        const bgSaturate = 0.8 + eased * 0.25;    // 0.8 → 1.05
        bg.style.filter = `brightness(${bgBrightness}) saturate(${bgSaturate})`;

        // Name fades out
        nameEl.style.opacity = Math.max(0, 1 - t * 2.5);
        eyesEl.style.opacity = Math.max(0, 1 - t * 3);
      }
    }

    // Wheel — bidirectional
    window.addEventListener('wheel', e => {
      e.preventDefault();
      rawScroll += e.deltaY;
      // Clamp both directions
      rawScroll = Math.max(-SCROLL_DOWN_MAX, Math.min(SCROLL_UP_MAX, rawScroll));
      requestAnimationFrame(applyScroll);
    }, { passive: false });

    // Touch — bidirectional
    let touchStartY = 0;
    window.addEventListener('touchstart', e => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener('touchmove', e => {
      e.preventDefault();
      const dy = touchStartY - e.touches[0].clientY;
      touchStartY = e.touches[0].clientY;
      rawScroll += dy * 2.5;
      rawScroll = Math.max(-SCROLL_DOWN_MAX, Math.min(SCROLL_UP_MAX, rawScroll));
      requestAnimationFrame(applyScroll);
    }, { passive: false });

    // ── Eyes follow cursor ──
    let curX = innerWidth / 2, curY = innerHeight / 2;
    document.addEventListener('mousemove', e => { curX = e.clientX; curY = e.clientY; });

    const eyes = document.querySelectorAll('.eye');
    function updateEyes() {
      eyes.forEach(eye => {
        const r = eye.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        const a = Math.atan2(curY - cy, curX - cx);
        const d = Math.min(Math.hypot(curX - cx, curY - cy) / 80, 1) * 4;
        eye.querySelector('.pupil').style.transform =
          `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px)`;
      });
      requestAnimationFrame(updateEyes);
    }
    updateEyes();

    function scheduleBlink() {
      setTimeout(() => {
        eyes.forEach(e => {
          e.classList.add('blink');
          setTimeout(() => e.classList.remove('blink'), 150);
        });
        scheduleBlink();
      }, 2000 + Math.random() * 4000);
    }
    scheduleBlink();

    document.addEventListener('click', () => {
      eyes.forEach(e => {
        e.classList.add('blink');
        setTimeout(() => e.classList.remove('blink'), 150);
      });
    });
  </script>
</body>
</html>
