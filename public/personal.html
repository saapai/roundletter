<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>saapai</title>
  <meta name="description" content="saapai" />
  <link rel="canonical" href="https://saathvikpai.com" />
  <meta property="og:title" content="saapai" />
  <meta property="og:url" content="https://saathvikpai.com" />
  <meta property="og:type" content="website" />
  <style>
    html, body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #0a0a0a;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url('/art/bg-painting.jpeg') center center / cover no-repeat;
      filter: brightness(0.45) saturate(0.8);
    }

    .gallery {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10vh 8vw 6vh;
      box-sizing: border-box;
    }

    .sketch {
      display: block;
      max-width: min(60vw, 620px);
      max-height: 70vh;
      width: auto;
      height: auto;
      object-fit: contain;
      opacity: 0;
      animation: reveal 1.8s cubic-bezier(0.25, 0.1, 0.25, 1) 0.3s forwards;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .name {
      position: fixed;
      bottom: 2rem;
      right: 2.5rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: rgba(255,255,255,0.6);
      opacity: 0;
      letter-spacing: 0.1em;
      text-transform: lowercase;
      line-height: 1;
      user-select: none;
      animation: placard-in 1.2s cubic-bezier(0.25, 0.1, 0.25, 1) 1.8s forwards;
    }

    .name {
      z-index: 2;
    }

    @keyframes placard-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ── Eyes ── */
    .eyes-wrap {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
      mix-blend-mode: difference;
      cursor: pointer;
      opacity: 0;
      animation: placard-in 1s ease-out 2.6s forwards;
    }

    .eye {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.25);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: height 0.15s ease, border-radius 0.15s ease;
    }

    .pupil {
      width: 5px;
      height: 5px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      transition: transform 0.08s ease-out, opacity 0.15s ease;
    }

    .eye.blink {
      height: 3px;
      border-radius: 2px;
      overflow: hidden;
    }

    .eye.blink .pupil {
      opacity: 0;
    }

    @media (max-width: 640px) {
      .gallery {
        padding: 18vh 6vw 8vh;
      }

      .sketch {
        max-width: 88vw;
        max-height: 60vh;
      }

      .name {
        bottom: 1.25rem;
        right: 1.5rem;
        font-size: 10px;
        letter-spacing: 0.08em;
      }

      .eyes-wrap {
        top: 12px;
        gap: 6px;
      }

      .eye {
        width: 14px;
        height: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sketch, .name, .eyes-wrap {
        animation: none;
        opacity: 1;
      }
      .name {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <!-- Eyes that follow cursor -->
  <div class="eyes-wrap" id="eyes">
    <div class="eye"><div class="pupil"></div></div>
    <div class="eye"><div class="pupil"></div></div>
  </div>

  <div class="gallery">
    <img class="sketch" src="/art/sketch-homepage.jpeg" alt="Pencil sketch" />
  </div>

  <span class="name">saapai</span>

  <script>
    // ── Eyes follow cursor ──
    let curX = innerWidth / 2, curY = innerHeight / 2;
    document.addEventListener('mousemove', e => { curX = e.clientX; curY = e.clientY; });

    const eyes = document.querySelectorAll('.eye');

    function updateEyes() {
      eyes.forEach(eye => {
        const r = eye.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        const a = Math.atan2(curY - cy, curX - cx);
        const d = Math.min(Math.hypot(curX - cx, curY - cy) / 80, 1) * 4;
        eye.querySelector('.pupil').style.transform =
          `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px)`;
      });
      requestAnimationFrame(updateEyes);
    }
    updateEyes();

    // Blink randomly
    function scheduleBlink() {
      const delay = 2000 + Math.random() * 4000;
      setTimeout(() => {
        eyes.forEach(e => {
          e.classList.add('blink');
          setTimeout(() => e.classList.remove('blink'), 150);
        });
        scheduleBlink();
      }, delay);
    }
    scheduleBlink();

    // Blink on click anywhere
    document.addEventListener('click', () => {
      eyes.forEach(e => {
        e.classList.add('blink');
        setTimeout(() => e.classList.remove('blink'), 150);
      });
    });
  </script>
</body>
</html>
