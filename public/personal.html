<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>saapai</title>
  <meta name="description" content="saapai" />
  <link rel="canonical" href="https://saathvikpai.com" />
  <meta property="og:title" content="saapai" />
  <meta property="og:url" content="https://saathvikpai.com" />
  <meta property="og:type" content="website" />
  <style>
    html, body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: #0a0a0a;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url('/art/bg-painting.jpeg') center center / cover no-repeat;
      filter: brightness(0.45) saturate(0.8);
      will-change: filter;
    }

    .gallery {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      box-sizing: border-box;
      will-change: transform, opacity;
      /* Dark spot next to the doorframe — right of center, upper third */
      transform-origin: 62% 33%;
    }

    .sketch {
      display: block;
      max-width: min(60vw, 620px);
      max-height: 70vh;
      width: auto;
      height: auto;
      object-fit: contain;
      opacity: 0;
      animation: reveal 1.8s cubic-bezier(0.25, 0.1, 0.25, 1) 0.3s forwards;
      mask-image: radial-gradient(
        ellipse 85% 85% at 50% 50%,
        black 55%,
        rgba(0,0,0,0.6) 72%,
        rgba(0,0,0,0.2) 88%,
        transparent 100%
      );
      -webkit-mask-image: radial-gradient(
        ellipse 85% 85% at 50% 50%,
        black 55%,
        rgba(0,0,0,0.6) 72%,
        rgba(0,0,0,0.2) 88%,
        transparent 100%
      );
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .name {
      position: fixed;
      bottom: 2rem;
      right: 2.5rem;
      z-index: 3;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: rgba(255,255,255,0.6);
      opacity: 0;
      letter-spacing: 0.1em;
      text-transform: lowercase;
      line-height: 1;
      user-select: none;
      animation: placard-in 1.2s cubic-bezier(0.25, 0.1, 0.25, 1) 1.8s forwards;
    }

    @keyframes placard-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .eyes-wrap {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
      mix-blend-mode: difference;
      cursor: pointer;
      opacity: 0;
      animation: placard-in 1s ease-out 2.6s forwards;
    }

    .eye {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.25);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: height 0.15s ease, border-radius 0.15s ease;
    }

    .pupil {
      width: 5px;
      height: 5px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      transition: transform 0.08s ease-out, opacity 0.15s ease;
    }

    .eye.blink { height: 3px; border-radius: 2px; overflow: hidden; }
    .eye.blink .pupil { opacity: 0; }

    @media (max-width: 640px) {
      .sketch { max-width: 88vw; max-height: 60vh; }
      .name { bottom: 1.25rem; right: 1.5rem; font-size: 10px; letter-spacing: 0.08em; }
      .eyes-wrap { top: 12px; gap: 6px; }
      .eye { width: 14px; height: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sketch, .name, .eyes-wrap { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="bg" id="bg"></div>

  <div class="eyes-wrap" id="eyes">
    <div class="eye"><div class="pupil"></div></div>
    <div class="eye"><div class="pupil"></div></div>
  </div>

  <div class="gallery" id="gallery">
    <img class="sketch" id="sketch" src="/art/sketch-homepage.jpeg" alt="Pencil sketch" />
  </div>

  <span class="name" id="nameEl">saapai</span>

  <script>
    const bg = document.getElementById('bg');
    const gallery = document.getElementById('gallery');
    const sketch = document.getElementById('sketch');
    const nameEl = document.getElementById('nameEl');
    const eyesEl = document.getElementById('eyes');

    // Smoothed scroll position — drives all transforms
    let scrollPos = 0; // negative = down (bg reveal), positive = up (into sketch)
    const UP_MAX = 2000;
    const DOWN_MAX = 1500;

    const TILT = 8; // degrees — tilts the OTHER way now (positive = CCW)
    const MAX_SCALE_IN = 3.2;

    // ── Diminishing returns on scroll input ──
    // Each wheel delta gets dampened: sqrt scaling + position resistance
    // Scrolling hard does more, but massively capped
    function dampenDelta(delta, currentPos) {
      // Sqrt of absolute delta — fast scroll has diminishing returns
      const dampened = Math.sign(delta) * Math.sqrt(Math.abs(delta)) * 1.8;

      // Position resistance: the further from 0, the harder to push further
      // Going positive (into sketch): resistance increases with scrollPos
      // Going negative (into bg): resistance increases with -scrollPos
      let resistance = 1;
      if (delta > 0 && currentPos > 0) {
        // Pushing deeper into sketch — increasing resistance
        resistance = 1 / (1 + (currentPos / UP_MAX) * 2.5);
      } else if (delta < 0 && currentPos < 0) {
        // Pushing deeper into bg — increasing resistance
        resistance = 1 / (1 + (Math.abs(currentPos) / DOWN_MAX) * 2.5);
      }
      // Returning toward center is always easy (resistance = 1)

      return dampened * resistance;
    }

    function applyScroll() {
      if (scrollPos >= 0) {
        // ── INTO THE SKETCH ──
        const t = Math.min(1, scrollPos / UP_MAX);

        const scale = 1 + t * (MAX_SCALE_IN - 1);
        const rotate = t * TILT;
        gallery.style.transform = `scale(${scale}) rotate(${rotate}deg)`;
        gallery.style.opacity = 1;

        // Relax mask as sketch fills viewport
        const maskCore = 55 + t * 30;
        const maskMid = 72 + t * 18;
        const maskOuter = 88 + t * 10;
        const maskCSS = `radial-gradient(
          ellipse 85% 85% at 50% 50%,
          black ${maskCore}%,
          rgba(0,0,0,0.6) ${maskMid}%,
          rgba(0,0,0,0.2) ${maskOuter}%,
          transparent 100%
        )`;
        sketch.style.maskImage = maskCSS;
        sketch.style.webkitMaskImage = maskCSS;

        // Bg dims
        bg.style.filter = `brightness(${0.45 - t * 0.2}) saturate(${0.8 - t * 0.3})`;

        nameEl.style.opacity = Math.max(0, 1 - t * 3);
        eyesEl.style.opacity = Math.max(0, 1 - t * 4);

      } else {
        // ── PAN AWAY — reveal background painting ──
        const t = Math.min(1, Math.abs(scrollPos) / DOWN_MAX);

        // Gentle pan: sketch drifts upward and slightly shrinks
        const panY = t * -25; // vh units worth of drift
        const scale = 1 - t * 0.08; // barely shrinks
        const sketchOpacity = Math.max(0, 1 - t * 1.2); // slow fade, not a snap
        gallery.style.transform = `scale(${scale}) translateY(${panY}vh)`;
        gallery.style.opacity = sketchOpacity;

        // Reset mask
        const defaultMask = `radial-gradient(
          ellipse 85% 85% at 50% 50%,
          black 55%, rgba(0,0,0,0.6) 72%, rgba(0,0,0,0.2) 88%, transparent 100%
        )`;
        sketch.style.maskImage = defaultMask;
        sketch.style.webkitMaskImage = defaultMask;

        // Background painting reveals with clarity
        bg.style.filter = `brightness(${0.45 + t * 0.4}) saturate(${0.8 + t * 0.25})`;

        nameEl.style.opacity = Math.max(0, 1 - t * 2);
        eyesEl.style.opacity = Math.max(0, 1 - t * 2);
      }
    }

    // Wheel — diminishing returns on velocity
    window.addEventListener('wheel', e => {
      e.preventDefault();
      const effective = dampenDelta(e.deltaY, scrollPos);
      scrollPos += effective;
      scrollPos = Math.max(-DOWN_MAX, Math.min(UP_MAX, scrollPos));
      requestAnimationFrame(applyScroll);
    }, { passive: false });

    // Touch — same dampening
    let touchStartY = 0;
    window.addEventListener('touchstart', e => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener('touchmove', e => {
      e.preventDefault();
      const dy = touchStartY - e.touches[0].clientY;
      touchStartY = e.touches[0].clientY;
      const effective = dampenDelta(dy * 2, scrollPos);
      scrollPos += effective;
      scrollPos = Math.max(-DOWN_MAX, Math.min(UP_MAX, scrollPos));
      requestAnimationFrame(applyScroll);
    }, { passive: false });

    // ── Eyes ──
    let curX = innerWidth / 2, curY = innerHeight / 2;
    document.addEventListener('mousemove', e => { curX = e.clientX; curY = e.clientY; });

    const eyes = document.querySelectorAll('.eye');
    function updateEyes() {
      eyes.forEach(eye => {
        const r = eye.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        const a = Math.atan2(curY - cy, curX - cx);
        const d = Math.min(Math.hypot(curX - cx, curY - cy) / 80, 1) * 4;
        eye.querySelector('.pupil').style.transform =
          `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px)`;
      });
      requestAnimationFrame(updateEyes);
    }
    updateEyes();

    function scheduleBlink() {
      setTimeout(() => {
        eyes.forEach(e => {
          e.classList.add('blink');
          setTimeout(() => e.classList.remove('blink'), 150);
        });
        scheduleBlink();
      }, 2000 + Math.random() * 4000);
    }
    scheduleBlink();

    document.addEventListener('click', () => {
      eyes.forEach(e => {
        e.classList.add('blink');
        setTimeout(() => e.classList.remove('blink'), 150);
      });
    });
  </script>
</body>
</html>
