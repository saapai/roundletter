<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>saapai</title>
  <meta name="description" content="saapai" />
  <link rel="canonical" href="https://saathvikpai.com" />
  <meta property="og:title" content="saapai" />
  <meta property="og:url" content="https://saathvikpai.com" />
  <meta property="og:type" content="website" />
  <style>
    html, body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: #0a0a0a;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url('/art/bg-painting.jpeg') center center / cover no-repeat;
      filter: brightness(0.45) saturate(0.8);
      will-change: opacity;
    }

    /* Vignette fades to paper-white, centered on the sketch */
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(
        ellipse 45% 50% at 50% 50%,
        rgba(240,237,232,0.0) 30%,
        rgba(240,237,232,0.8) 65%,
        rgba(240,237,232,1) 100%
      );
      will-change: opacity;
    }

    /* Full paper color wash that fades in at the end */
    .paper-wash {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: #F0EDE8;
      opacity: 0;
      will-change: opacity;
    }

    .gallery {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      box-sizing: border-box;
      will-change: transform;
    }

    .sketch {
      display: block;
      max-width: min(60vw, 620px);
      max-height: 70vh;
      width: auto;
      height: auto;
      object-fit: contain;
      opacity: 0;
      animation: reveal 1.8s cubic-bezier(0.25, 0.1, 0.25, 1) 0.3s forwards;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .name {
      position: fixed;
      bottom: 2rem;
      right: 2.5rem;
      z-index: 3;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: rgba(255,255,255,0.6);
      opacity: 0;
      letter-spacing: 0.1em;
      text-transform: lowercase;
      line-height: 1;
      user-select: none;
      animation: placard-in 1.2s cubic-bezier(0.25, 0.1, 0.25, 1) 1.8s forwards;
      will-change: opacity;
      transition: color 0.6s ease;
    }

    @keyframes placard-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ── Eyes ── */
    .eyes-wrap {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
      mix-blend-mode: difference;
      cursor: pointer;
      opacity: 0;
      animation: placard-in 1s ease-out 2.6s forwards;
    }

    .eye {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.25);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: height 0.15s ease, border-radius 0.15s ease;
    }

    .pupil {
      width: 5px;
      height: 5px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      transition: transform 0.08s ease-out, opacity 0.15s ease;
    }

    .eye.blink { height: 3px; border-radius: 2px; overflow: hidden; }
    .eye.blink .pupil { opacity: 0; }

    @media (max-width: 640px) {
      .gallery { padding: 18vh 6vw 8vh; }
      .sketch { max-width: 88vw; max-height: 60vh; }
      .name { bottom: 1.25rem; right: 1.5rem; font-size: 10px; letter-spacing: 0.08em; }
      .eyes-wrap { top: 12px; gap: 6px; }
      .eye { width: 14px; height: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sketch, .name, .eyes-wrap { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="bg" id="bg"></div>
  <div class="paper-wash" id="paperWash"></div>
  <div class="vignette" id="vignette"></div>

  <div class="eyes-wrap" id="eyes">
    <div class="eye"><div class="pupil"></div></div>
    <div class="eye"><div class="pupil"></div></div>
  </div>

  <div class="gallery" id="gallery">
    <img class="sketch" id="sketch" src="/art/sketch-homepage.jpeg" alt="Pencil sketch" />
  </div>

  <span class="name" id="nameEl">saapai</span>

  <script>
    const bg = document.getElementById('bg');
    const vignette = document.getElementById('vignette');
    const paperWash = document.getElementById('paperWash');
    const gallery = document.getElementById('gallery');
    const sketch = document.getElementById('sketch');
    const nameEl = document.getElementById('nameEl');
    const eyesEl = document.getElementById('eyes');

    let rawScroll = 0;
    const MAX_SCROLL = 2800;

    // Bell curve rate: slow → fast → slow
    function bellCurveMap(t) {
      if (t <= 0) return 0;
      if (t >= 1) return 1;
      const z = (t - 0.5) / 0.18;
      return 1 / (1 + Math.exp(-1.7 * z * (1 + 0.044715 * z * z) * 1.5));
    }

    // Figure out how much to scale the sketch to fill viewport
    function getSketchFillScale() {
      const rect = sketch.getBoundingClientRect();
      if (!rect.width || !rect.height) return 3;
      const sx = window.innerWidth / rect.width;
      const sy = window.innerHeight / rect.height;
      return Math.max(sx, sy) * 1.15; // slight overfill
    }

    function applyScroll() {
      const t = Math.max(0, Math.min(1, rawScroll / MAX_SCROLL));
      const eased = bellCurveMap(t);

      const fillScale = getSketchFillScale();

      // ── Sketch: scales up + slight spiral rotation ──
      const sketchScale = 1 + eased * (fillScale - 1);
      const sketchRotate = eased * 35; // gentle spiral, not violent
      gallery.style.transform = `scale(${sketchScale}) rotate(${sketchRotate}deg)`;

      // ── Background: fades out as sketch takes over ──
      bg.style.opacity = Math.max(0, 1 - eased * 2.5); // gone by 40%

      // ── Vignette: paper-colored, closes in to mask bg edges ──
      // Fades in as bg fades, creating seamless transition
      const vigOpacity = Math.min(1, eased * 2); // fully on by 50%
      vignette.style.opacity = vigOpacity;

      // Vignette hole shrinks: sketch grows to fill it
      const holeSize = 50 - eased * 25; // 50% → 25% (sketch fills the rest)
      vignette.style.background = `radial-gradient(
        ellipse ${holeSize}% ${holeSize * 1.1}% at 50% 50%,
        transparent 60%,
        rgba(240,237,232,0.7) 80%,
        rgba(240,237,232,1) 100%
      )`;

      // ── Paper wash: fills in fully at the end ──
      // Only kicks in late, covering any remaining bg peeks
      const washOpacity = Math.max(0, (eased - 0.6) / 0.4); // 0 until 60%, then 0→1
      paperWash.style.opacity = washOpacity;

      // ── Name: transitions to dark on paper ──
      if (eased > 0.5) {
        nameEl.style.color = `rgba(0,0,0,0.3)`;
      } else {
        nameEl.style.color = `rgba(255,255,255,0.6)`;
      }

      // ── Eyes fade out early ──
      eyesEl.style.opacity = Math.max(0, 1 - t * 5);
    }

    // Wheel
    window.addEventListener('wheel', e => {
      e.preventDefault();
      rawScroll = Math.max(0, rawScroll + e.deltaY);
      requestAnimationFrame(applyScroll);
    }, { passive: false });

    // Touch
    let touchStartY = 0;
    window.addEventListener('touchstart', e => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchmove', e => {
      e.preventDefault();
      const dy = touchStartY - e.touches[0].clientY;
      touchStartY = e.touches[0].clientY;
      rawScroll = Math.max(0, rawScroll + dy * 2.5);
      requestAnimationFrame(applyScroll);
    }, { passive: false });

    // ── Eyes follow cursor ──
    let curX = innerWidth / 2, curY = innerHeight / 2;
    document.addEventListener('mousemove', e => { curX = e.clientX; curY = e.clientY; });

    const eyes = document.querySelectorAll('.eye');
    function updateEyes() {
      eyes.forEach(eye => {
        const r = eye.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        const a = Math.atan2(curY - cy, curX - cx);
        const d = Math.min(Math.hypot(curX - cx, curY - cy) / 80, 1) * 4;
        eye.querySelector('.pupil').style.transform =
          `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px)`;
      });
      requestAnimationFrame(updateEyes);
    }
    updateEyes();

    function scheduleBlink() {
      setTimeout(() => {
        eyes.forEach(e => {
          e.classList.add('blink');
          setTimeout(() => e.classList.remove('blink'), 150);
        });
        scheduleBlink();
      }, 2000 + Math.random() * 4000);
    }
    scheduleBlink();

    document.addEventListener('click', () => {
      eyes.forEach(e => {
        e.classList.add('blink');
        setTimeout(() => e.classList.remove('blink'), 150);
      });
    });
  </script>
</body>
</html>
