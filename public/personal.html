<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>saapai</title>
  <meta name="description" content="saapai" />
  <link rel="canonical" href="https://saathvikpai.com" />
  <meta property="og:title" content="saapai" />
  <meta property="og:url" content="https://saathvikpai.com" />
  <meta property="og:type" content="website" />
  <style>
    html, body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: #0a0a0a;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url('/art/bg-painting.jpeg') center center / cover no-repeat;
      filter: brightness(0.18) saturate(0.6);
      will-change: filter;
    }

    .gallery {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      box-sizing: border-box;
    }

    .sketch {
      display: block;
      max-width: min(60vw, 620px);
      max-height: 70vh;
      width: auto;
      height: auto;
      object-fit: contain;
      opacity: 0;
      animation: reveal 1.8s cubic-bezier(0.25, 0.1, 0.25, 1) 0.3s forwards;
      /* JS handles transform after load — animation only does opacity */
      will-change: transform;
      /* Door spot in the IMAGE — center-right, middle of the sketch */
      transform-origin: 55% 45%;
      /* Subtle edge feather */
      -webkit-mask-image:
        linear-gradient(to right,  transparent, rgba(0,0,0,0.5) 3%, black 8%, black 92%, rgba(0,0,0,0.5) 97%, transparent),
        linear-gradient(to bottom, transparent, rgba(0,0,0,0.5) 3%, black 8%, black 92%, rgba(0,0,0,0.5) 97%, transparent);
      -webkit-mask-composite: source-in;
      mask-image:
        linear-gradient(to right,  transparent, rgba(0,0,0,0.5) 3%, black 8%, black 92%, rgba(0,0,0,0.5) 97%, transparent),
        linear-gradient(to bottom, transparent, rgba(0,0,0,0.5) 3%, black 8%, black 92%, rgba(0,0,0,0.5) 97%, transparent);
      mask-composite: intersect;
    }

    @keyframes reveal {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .name {
      position: fixed;
      bottom: 2rem;
      right: 2.5rem;
      z-index: 3;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: rgba(255,255,255,0.6);
      opacity: 0;
      letter-spacing: 0.1em;
      text-transform: lowercase;
      line-height: 1;
      user-select: none;
      animation: placard-in 1.2s cubic-bezier(0.25, 0.1, 0.25, 1) 1.8s forwards;
    }

    @keyframes placard-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .eyes-wrap {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
      mix-blend-mode: difference;
      cursor: pointer;
      opacity: 0;
      animation: placard-in 1s ease-out 2.6s forwards;
    }

    .eye {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.25);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: height 0.15s ease, border-radius 0.15s ease;
    }

    .pupil {
      width: 5px;
      height: 5px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      transition: transform 0.08s ease-out, opacity 0.15s ease;
    }

    .eye.blink { height: 3px; border-radius: 2px; overflow: hidden; }
    .eye.blink .pupil { opacity: 0; }

    @media (max-width: 640px) {
      .sketch { max-width: 88vw; max-height: 60vh; }
      .name { bottom: 1.25rem; right: 1.5rem; font-size: 10px; letter-spacing: 0.08em; }
      .eyes-wrap { top: 12px; gap: 6px; }
      .eye { width: 14px; height: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sketch, .name, .eyes-wrap { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="bg" id="bg"></div>

  <div class="eyes-wrap" id="eyes">
    <div class="eye"><div class="pupil"></div></div>
    <div class="eye"><div class="pupil"></div></div>
  </div>

  <div class="gallery" id="gallery">
    <img class="sketch" id="sketch" src="/art/sketch-homepage.jpeg" alt="Pencil sketch" />
  </div>

  <span class="name" id="nameEl">saapai</span>

  <script>
    const bg = document.getElementById('bg');
    const gallery = document.getElementById('gallery');
    const sketch = document.getElementById('sketch');
    const nameEl = document.getElementById('nameEl');
    const eyesEl = document.getElementById('eyes');

    let scrollPos = 0;
    const UP_MAX = 600;
    const DOWN_MAX = 400;

    const TILT = 5;
    const MAX_SCALE_IN = 4.0;

    // Default origin on the sketch image: the door spot
    const DEFAULT_ORIGIN = '55% 45%';

    // Diminishing returns: linear pass-through, soft cap on big flicks,
    // resistance only near the edges (last 30%)
    function dampenDelta(delta, currentPos) {
      // Soft cap: linear up to 30, then logarithmic above that
      const abs = Math.abs(delta);
      const capped = abs <= 30 ? abs : 30 + Math.log(1 + abs - 30) * 8;
      let dampened = Math.sign(delta) * capped;

      // Edge resistance: only in the last 30% of travel
      let resistance = 1;
      if (delta > 0 && currentPos > 0) {
        const depth = currentPos / UP_MAX;
        resistance = depth > 0.7 ? 1 / (1 + (depth - 0.7) * 6) : 1;
      } else if (delta < 0 && currentPos < 0) {
        const depth = Math.abs(currentPos) / DOWN_MAX;
        resistance = depth > 0.7 ? 1 / (1 + (depth - 0.7) * 6) : 1;
      }
      return dampened * resistance;
    }

    function applyScroll() {
      if (scrollPos >= 0) {
        // ── INTO THE SKETCH (transforms on sketch element directly) ──
        const t = Math.min(1, scrollPos / UP_MAX);

        const scale = 1 + t * (MAX_SCALE_IN - 1);

        // Delayed quadratic tilt: nothing until 40%, then accelerates
        const tiltT = Math.max(0, (t - 0.4) / 0.6);
        const rotate = tiltT * tiltT * TILT;

        // Apply to SKETCH, not gallery — origin is relative to the image
        sketch.style.transform = `scale(${scale}) rotate(${rotate}deg)`;
        gallery.style.transform = '';
        gallery.style.opacity = 1;

        // Edge feather relaxes as sketch fills viewport
        const feather = Math.max(1, 4 - t * 3); // 4% → 1%
        const solidEnd = Math.min(99, 96 + t * 3); // 96% → 99%
        const maskH = `linear-gradient(to right, transparent, black ${feather}%, black ${solidEnd}%, transparent)`;
        const maskV = `linear-gradient(to bottom, transparent, black ${feather}%, black ${solidEnd}%, transparent)`;
        sketch.style.webkitMaskImage = `${maskH}, ${maskV}`;
        sketch.style.maskImage = `${maskH}, ${maskV}`;

        // Bg dims, subtle warmth at the very end
        if (t < 0.85) {
          const bgT = t / 0.85;
          bg.style.filter = `brightness(${0.18 - bgT * 0.14}) saturate(${0.6 - bgT * 0.4})`;
        } else {
          const revealT = (t - 0.85) / 0.15;
          bg.style.filter = `brightness(${0.04 + revealT * 0.08}) saturate(${0.2 + revealT * 0.5})`;
        }

        nameEl.style.opacity = Math.max(0, 1 - t * 3);
        eyesEl.style.opacity = Math.max(0, 1 - t * 4);

      } else {
        // ── PAN AWAY — reveal background painting ──
        const t = Math.min(1, Math.abs(scrollPos) / DOWN_MAX);

        // Reset sketch transform
        sketch.style.transform = '';

        // Gentle pan: gallery drifts upward
        const panY = t * -20;
        const scale = 1 - t * 0.06;
        const sketchOpacity = Math.max(0, 1 - t * 1.2);
        gallery.style.transform = `scale(${scale}) translateY(${panY}vh)`;
        gallery.style.opacity = sketchOpacity;

        // Background painting reveals
        bg.style.filter = `brightness(${0.18 + t * 0.5}) saturate(${0.6 + t * 0.4})`;

        nameEl.style.opacity = Math.max(0, 1 - t * 2);
        eyesEl.style.opacity = Math.max(0, 1 - t * 2);
      }
    }

    // Wheel
    window.addEventListener('wheel', e => {
      e.preventDefault();
      const effective = dampenDelta(e.deltaY, scrollPos);
      scrollPos += effective;
      scrollPos = Math.max(-DOWN_MAX, Math.min(UP_MAX, scrollPos));
      requestAnimationFrame(applyScroll);
    }, { passive: false });

    // Touch — scroll (1 finger) + pinch zoom (2 fingers)
    let touchStartY = 0;
    let lastPinchDist = 0;
    let isPinching = false;

    window.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        isPinching = true;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        lastPinchDist = Math.hypot(dx, dy);

        // Set transform-origin on sketch to pinch midpoint mapped to image coords
        const rect = sketch.getBoundingClientRect();
        const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const px = ((mx - rect.left) / rect.width) * 100;
        const py = ((my - rect.top) / rect.height) * 100;
        sketch.style.transformOrigin = `${Math.max(0, Math.min(100, px))}% ${Math.max(0, Math.min(100, py))}%`;
      } else {
        isPinching = false;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    window.addEventListener('touchmove', e => {
      e.preventDefault();
      if (e.touches.length === 2 && isPinching) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        const delta = (dist - lastPinchDist) * 3;
        lastPinchDist = dist;

        const effective = dampenDelta(delta, scrollPos);
        scrollPos += effective;
        scrollPos = Math.max(-DOWN_MAX, Math.min(UP_MAX, scrollPos));
        requestAnimationFrame(applyScroll);
      } else if (e.touches.length === 1 && !isPinching) {
        const dy = touchStartY - e.touches[0].clientY;
        touchStartY = e.touches[0].clientY;
        const effective = dampenDelta(dy * 2, scrollPos);
        scrollPos += effective;
        scrollPos = Math.max(-DOWN_MAX, Math.min(UP_MAX, scrollPos));
        requestAnimationFrame(applyScroll);
      }
    }, { passive: false });

    window.addEventListener('touchend', e => {
      if (e.touches.length < 2) {
        isPinching = false;
        if (e.touches.length === 0) {
          sketch.style.transformOrigin = DEFAULT_ORIGIN;
        }
      }
    }, { passive: true });

    // ── Eyes ──
    let curX = innerWidth / 2, curY = innerHeight / 2;
    document.addEventListener('mousemove', e => { curX = e.clientX; curY = e.clientY; });

    const eyes = document.querySelectorAll('.eye');
    function updateEyes() {
      eyes.forEach(eye => {
        const r = eye.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        const a = Math.atan2(curY - cy, curX - cx);
        const d = Math.min(Math.hypot(curX - cx, curY - cy) / 80, 1) * 4;
        eye.querySelector('.pupil').style.transform =
          `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px)`;
      });
      requestAnimationFrame(updateEyes);
    }
    updateEyes();

    function scheduleBlink() {
      setTimeout(() => {
        eyes.forEach(e => {
          e.classList.add('blink');
          setTimeout(() => e.classList.remove('blink'), 150);
        });
        scheduleBlink();
      }, 2000 + Math.random() * 4000);
    }
    scheduleBlink();

    document.addEventListener('click', () => {
      eyes.forEach(e => {
        e.classList.add('blink');
        setTimeout(() => e.classList.remove('blink'), 150);
      });
    });
  </script>
</body>
</html>
